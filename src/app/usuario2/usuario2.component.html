<div class="fondo">

    <div style="position: absolute; top: 50px; ">
        <img src="imagenes/LOGO RACSAPP-BLANCO.png" alt="Avatar" class="avatar">
    </div>

    <div style="position: absolute; left:50%; justify-content: center;transform: translate(-50%, 0px); text-align:center; top: 50px; ">
       <h1> Usuarios</h1>
    </div>

    <div style="position: absolute;right: 50px; top: 50px; ">
        <a href="/usuarios"><img class="img2" src="https://www.w3schools.com/howto/img_avatar.png" /></a>
    </div>
    
    




    <div class="centro">
        <form class="example-form" style="text-align: right;">
            <div class="form-group">
                <mat-form-field >
                    <input matInput type="text" placeholder="Busqueda"  style="color:black">
                    <mat-icon style="color:black;" matIconSuffix>search</mat-icon>
                </mat-form-field>
            </div> 
        </form>


        
        <table mat-table [dataSource]="dataSource" class="listabicolor" style="background-color: transparent;color:white; ">


        <!-- Name Column -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef style="background-color: #048d9c;color:white;  font-family: 'Barlow';font-weight: 100;  width:80%"> NOMBRE DEL USUARIO </th>
            <td mat-cell *matCellDef="let element" style="color:white;  font-family: 'Barlow';font-weight: 100;"> {{element.name}} </td>
        </ng-container>

        <ng-container matColumnDef="boton">
            <th mat-header-cell *matHeaderCellDef style="background-color: #048d9c;color:white;  font-family: 'Barlow';font-weight: 100;  width:10%"> </th>
            <td mat-cell *matCellDef="let element" style="text-align: center; font-family: 'Barlow';font-weight: 100;"> <button mat-mini-fab style="background-color:transparent;box-shadow: none; color:white" ><mat-icon>edit</mat-icon></button></td>
        </ng-container>


        <ng-container matColumnDef="icon">
            <th mat-header-cell *matHeaderCellDef style="background-color: #048d9c;color:white;  font-family: 'Barlow';font-weight: 100;  width:10%"> </th>
            <td mat-cell *matCellDef="let element" style="text-align: center; font-family: 'Barlow';font-weight: 100;">  <button mat-mini-fab style="background-color:transparent;box-shadow: none; color:white" ><mat-icon>cancel</mat-icon></button> </td>
        </ng-container>


        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator style="background-color: #048d9c;color:white; " #paginator
                        [pageSize]="10"
                        [pageSizeOptions]="[5, 10, 15, 20]"
                        showPageSizeOptions = true;
                        showFirstLastButtons = true;>
        </mat-paginator>


         <br><br><br>
          <div style="text-align: center; display: flex; width: 100%;">
            <div style="width: 70%; text-align: right;">
            </div>
            <div style="width: 15%; text-align: right;">
              <a href="/usuario" class="button1" >Agregar Usuario</a>
            </div>
            <div style="width: 15%; text-align: right;">
              <a href="/usuarios" class="button1" > Cancelar</a>
            </div>
          </div><br><br>
    </div>
</div>
